<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — UIC ASME</title>
<meta name="description" content="Photos from UIC ASME workshops, socials, and industry events.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-mark">A</span>
      <span>UIC ASME<small>Est. Mechanical Eng. Dept.</small></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="team.html">Team</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <div class="nav-actions">
      <a href="about.html#join" class="btn btn-primary btn-sm">Join Chapter</a>
      <button class="nav-toggle" aria-label="Toggle menu"><span></span></button>
    </div>
  </div>
</nav>

<header class="hero blueprint-bg" style="padding:64px 0 40px;">
  <div class="container">
    <div class="eyebrow reveal in">Photo log</div>
    <h1 style="font-size:clamp(34px,4.6vw,52px); margin-top:16px;" class="reveal in">Gallery</h1>
    <p class="lead reveal in" style="margin-top:16px;">Moments from workshops, socials, and industry nights — click any photo to expand.</p>
  </div>
</header>

<section style="padding-top:8px;">
  <div class="container">
    <div class="gallery-grid reveal-stagger reveal">
      <div class="gallery-item"><img src="assets/img/hero-main.jpg" alt="General body meeting"></div>
      <div class="gallery-item"><img src="assets/img/event-workshop.jpg" alt="Engineering workshop"></div>
      <div class="gallery-item"><img src="assets/img/event-social.jpg" alt="Chapter social"></div>
      <div class="gallery-item"><img src="assets/img/event-group2.jpg" alt="Chapter group photo"></div>
      <div class="gallery-item"><img src="assets/img/event-uic-asme.jpg" alt="UIC ASME meeting"></div>
      <div class="gallery-item"><img src="assets/img/event-extra1.jpg" alt="Chapter event"></div>
      <div class="gallery-item"><img src="assets/img/event-extra2.jpg" alt="Chapter event"></div>
      <div class="gallery-item"><img src="assets/img/event-extra3.jpg" alt="Chapter event"></div>
      <div class="gallery-item"><img src="assets/img/event-extra4.jpg" alt="Chapter event"></div>
      <div class="gallery-item"><img src="assets/img/event-extra5.jpg" alt="Chapter event"></div>
      <div class="gallery-item"><img src="assets/img/event-extra6.jpg" alt="Chapter event"></div>
      <div class="gallery-item"><img src="assets/img/headshot13.jpg" alt="Chapter member"></div>
    </div>
  </div>
</section>

<div class="lightbox">
  <button class="lightbox-close" aria-label="Close">✕</button>
  <img src="" alt="Expanded gallery photo">
</div>

<footer>
  <div class="container">
    <div class="footer-bottom" style="margin-top:0; border-top:none; padding-top:0;">
      <span>© 2026 UIC ASME Student Chapter</span>
      <span>Design reference: ASME_Website.fig</span>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
